    <script>
      // Gracefully ignore harmless Vite HMR WebSocket disconnects in AI Studio preview iframe
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && e.reason;
        var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('vite:ws') || msg.includes('@vite/client'))) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        var msg = (e && (e.message || e.filename)) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('vite:ws') || msg.includes('@vite/client'))) {
          e.preventDefault();
        }
      });
    </script>
